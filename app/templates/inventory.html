<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Inventory Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/inventory.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
<div class="sidebar">
        <h2 class="logo">Quản Lý <br> Quán Cafe</h2>
        <ul>
            <li onclick="window.location.href='/menu/'" style="cursor: pointer;">Menu</li>
            
            <li class="active"  onclick="window.location.href='/inventory/'" style="cursor: pointer;">Inventory</li>
            
            <li onclick="window.location.href='/recipe/'" style="cursor: pointer;">Recipe</li>
            
            <li onclick="window.location.href='/orders/'" style="cursor: pointer;">Orders</li>
            
            <li onclick="window.location.href='/reports/'" style="cursor: pointer;">Reports</li>
        </ul>
    </div>


    <!-- MAIN -->
    <div class="main-content">

        <div class="page-title">
            <h1>Quản lý Kho Nguyên Liệu</h1>
        </div>


        <!-- SEARCH -->
        <div class="search-box">

            <input type="text"
                id="searchKeyword"
                class="form-control"
                placeholder="Tên nguyên liệu..."
                onkeyup="searchInventory()">

            <input type="number"
                id="minStock"
                class="form-control"
                placeholder="Tồn kho từ"
                onkeyup="searchInventory()">

            <input type="number"
                id="maxStock"
                class="form-control"
                placeholder="Tồn kho đến"
                onkeyup="searchInventory()">

        </div>


        <!-- STATS -->
        <div class="cards">

            <div class="card-box">
                <h3>Tổng nguyên liệu</h3>
                <p id="totalInventory">0</p>
            </div>

        </div>


        <!-- FORM -->
        <div class="form-box">

            <h3>Thêm / Sửa nguyên liệu</h3>

            <div class="form-grid">

                <input id="TenNL" class="form-control" placeholder="Tên nguyên liệu">

                <input id="DonViTinh" class="form-control" placeholder="Đơn vị tính">

                <input id="SoLuongTon" class="form-control" placeholder="Số lượng tồn" type="number">

                <input id="DinhMucTonKho" class="form-control" placeholder="Định mức tồn kho" type="number">

            </div>

            <div class="action-buttons">

                <button class="btn btn-warning" onclick="addIngredient()">
                    Thêm nguyên liệu
                </button>

                <button class="btn btn-dark" onclick="updateIngredient()">
                    Cập nhật
                </button>

            </div>

        </div>


        <!-- IMPORT -->
<!-- NHẬP HÀNG -->
<div class="form-box">

    <h3>Nhập hàng</h3>

    <div class="form-grid">

        <input id="ImportId"
            class="form-control"
            placeholder="Mã nguyên liệu"
            type="number"
            onchange="loadIngredientStock()">

        <input id="CurrentStock"
            class="form-control"
            placeholder="Tồn kho hiện tại"
            readonly>

        <input id="SoLuongNhap"
            class="form-control"
            placeholder="Số lượng nhập"
            type="number">

        <input id="GiaNhap"
            class="form-control"
            placeholder="Giá nhập"
            type="number">

        <input id="NhaCungCap"
            class="form-control"
            placeholder="Nhà cung cấp">

        <input id="NgayNhap"
            class="form-control"
            type="datetime-local">

    </div>

    <textarea id="GhiChuNhap"
        class="form-control mt-3"
        placeholder="Ghi chú"></textarea>

    <div class="action-buttons">

        <button class="btn btn-success"
            onclick="importInventory()">
            Lưu phiếu nhập
        </button>

    </div>

</div>

<!-- KIỂM KHO -->
<div class="form-box">

    <h3>Kiểm kho</h3>

    <div class="form-grid">

        <input id="CheckMaNL"
            class="form-control"
            placeholder="Mã nguyên liệu"
            type="number"
            onchange="loadCheckInventory()">

        <input id="HeThongTon"
            class="form-control"
            placeholder="Tồn hệ thống"
            readonly>

        <input id="SoLuongThucTe"
            class="form-control"
            placeholder="Số lượng thực tế"
            type="number">

    </div>

    <div class="action-buttons">

        <button class="btn btn-primary"
            onclick="kiemKho()">
            Xác nhận kiểm kho
        </button>

    </div>

</div>


        <!-- TABLE -->
        <div class="table-box">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Tên nguyên liệu</th>
                        <th>Đơn vị</th>
                        <th>Tồn kho</th>
                        <th>Định mức</th>
                        <th>Tình trạng kho</th>
                        <th>Hành động</th>
                    </tr>

                </thead>

                <tbody id="inventoryTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/inventory.js') }}"></script>

</body>

</html>
