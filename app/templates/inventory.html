<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Kho Nguyên Liệu</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        input, button {
            padding: 6px;
            margin: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

        .row {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<h2>📦 Quản lý Kho Nguyên Liệu</h2>

<!-- FORM THÊM -->
<div class="row">
    <h3>➕ Thêm nguyên liệu</h3>

    <input id="TenNL" placeholder="Tên NL">
    <input id="DonViTinh" placeholder="Đơn vị">
    <input id="SoLuongTon" placeholder="Số lượng tồn">
    <input id="DinhMucTonKho" placeholder="Định mức tồn kho">
    <input id="TrangThai" placeholder="Trạng thái">

    <button onclick="addIngredient()">Thêm</button>
</div>

<hr>

<!-- NHẬP KHO -->
<div class="row">
    <h3>📥 Nhập kho</h3>

    <input id="importId" placeholder="Mã NL">
    <input id="importQty" placeholder="Số lượng nhập">

    <button onclick="importStock()">Nhập kho</button>
</div>

<hr>

<!-- TABLE -->
<table>
    <thead>
        <tr>
            <th>Mã NL</th>
            <th>Tên</th>
            <th>Đơn vị</th>
            <th>Tồn kho</th>
            <th>Định mức</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
    </thead>

    <tbody id="tbody"></tbody>
</table>

<script>

const API = "http://127.0.0.1:5000";

// LOAD DATA
async function loadData() {
    const res = await fetch(`${API}/inventory`);
    const data = await res.json();
    render(data);
}

// RENDER TABLE
function render(data) {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    data.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item.MaNL}</td>
                <td>${item.TenNL}</td>
                <td>${item.DonViTinh}</td>
                <td>${item.SoLuongTon}</td>
                <td>${item.DinhMucTonKho}</td>
                <td>${item.TrangThai}</td>
                <td>
                    <button onclick="deleteIngredient(${item.MaNL})">Xoá</button>
                    <button onclick="fillEdit(${item.MaNL}, '${item.TenNL}', '${item.DonViTinh}', ${item.SoLuongTon}, ${item.DinhMucTonKho}, '${item.TrangThai}')">Sửa</button>
                </td>
            </tr>
        `;
    });
}

// ADD
async function addIngredient() {
    const body = {
        TenNL: document.getElementById("TenNL").value,
        DonViTinh: document.getElementById("DonViTinh").value,
        SoLuongTon: parseFloat(document.getElementById("SoLuongTon").value),
        DinhMucTonKho: parseFloat(document.getElementById("DinhMucTonKho").value),
        TrangThai: document.getElementById("TrangThai").value
    };

    await fetch(`${API}/inventory`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
    });

    loadData();
}

// DELETE
async function deleteIngredient(id) {
    await fetch(`${API}/inventory/${id}`, {
        method: "DELETE"
    });

    loadData();
}

// IMPORT STOCK
async function importStock() {
    const id = document.getElementById("importId").value;
    const qty = document.getElementById("importQty").value;

    await fetch(`${API}/inventory/${id}/import`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            SoLuongNhap: parseFloat(qty)
        })
    });

    loadData();
}

// LOAD DATA INTO FORM (EDIT QUICK)
function fillEdit(id, TenNL, DonViTinh, SoLuongTon, DinhMucTonKho, TrangThai) {
    document.getElementById("TenNL").value = TenNL;
    document.getElementById("DonViTinh").value = DonViTinh;
    document.getElementById("SoLuongTon").value = SoLuongTon;
    document.getElementById("DinhMucTonKho").value = DinhMucTonKho;
    document.getElementById("TrangThai").value = TrangThai;

    alert("Bạn có thể sửa dữ liệu rồi gọi API PUT bằng tay (nếu muốn mình làm nút update mình thêm cho)");
}

// INIT
loadData();

</script>

</body>
</html>
