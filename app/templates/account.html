<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <title>Quản lý tài khoản</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/default.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


</head>

<body>

    <div class="wrapper">

        {% include 'sidebar.html' %}

        <!-- MAIN -->
        <div class="main-content">

            <div class="page-title">
                <h1>Quản lý tài khoản nhân viên</h1>
            </div>

            <div class="form-box">

                <h3>Tạo tài khoản</h3>

                <div class="form-grid">

                    <input id="HoTen" class="form-control" placeholder="Họ tên">

                    <input id="SDT" class="form-control" placeholder="Số điện thoại">

                    <input id="Email" class="form-control" placeholder="Email">

                    <input id="TenDangNhap" class="form-control" placeholder="Tên đăng nhập">

                    <input id="MatKhau" class="form-control" type="password" placeholder="Mật khẩu">

                    <select id="VaiTro" class="form-select">

                        <option value="NhanVien">
                            Nhân viên
                        </option>

                        <option value="QuanLy">
                            Quản lý
                        </option>

                    </select>

                </div>

                <div class="action-buttons">

                    <button class="btn btn-success" onclick="createAccount()">
                        Tạo tài khoản
                    </button>

                </div>

            </div>

            <div class="table-box">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>Mã NV</th>
                            <th>Họ tên</th>
                            <th>SĐT</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>

                        </tr>

                    </thead>

                    <tbody id="accountTable">

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Modal cập nhật tài khoản -->
        <div class="modal fade" id="updateModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Cập nhật tài khoản</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <input type="hidden" id="updateMaTK">

                        <div class="mb-3">
                            <label>Tên đăng nhập</label>
                            <input type="text" id="updateTenDangNhap" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Số điện thoại</label>
                            <input type="text" id="updateSDT" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" id="updateEmail" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Vai trò</label>
                            <select id="updateVaiTro" class="form-select">
                                <option value="NHANVIEN">Nhân viên</option>
                                <option value="ADMIN">Quản lý (Admin)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Mật khẩu mới</label>
                            <input type="password" id="updateMatKhau" class="form-control"
                                placeholder="Để trống nếu không đổi">
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">
                            Hủy
                        </button>

                        <button class="btn btn-primary" onclick="saveAccountUpdate()">
                            Lưu
                        </button>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    
    <script src="{{ url_for('static', filename='js/account.js') }}"></script>
    
</body>

</html>
