<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Công Thức</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        input, button {
            margin: 5px;
            padding: 6px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

        .row {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h2>📋 Quản lý Công Thức</h2>

<!-- FORM THÊM -->
<div class="row">
    <h3>➕ Thêm công thức</h3>

    <input id="maMon" placeholder="Mã món">
    <input id="maNL" placeholder="Mã nguyên liệu">
    <input id="soLuong" placeholder="Số lượng sử dụng">

    <button onclick="addRecipe()">Thêm</button>
</div>

<hr>

<!-- TÌM THEO MÓN -->
<div class="row">
    <h3>🔍 Xem theo món</h3>
    <input id="searchMaMon" placeholder="Nhập mã món">
    <button onclick="getByMon()">Tìm</button>
    <button onclick="loadAll()">Tất cả</button>
</div>

<!-- TABLE -->
<table>
    <thead>
        <tr>
            <th>Mã CT</th>
            <th>Mã Món</th>
            <th>Mã NL</th>
            <th>Tên NL</th>
            <th>Số lượng</th>
            <th>Đơn vị</th>
            <th>Hành động</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<script>

const API = "http://127.0.0.1:5000";

// LOAD ALL
async function loadAll() {
    const res = await fetch(`${API}/recipes`);
    const data = await res.json();
    render(data);
}

// SEARCH BY MON
async function getByMon() {
    const maMon = document.getElementById("searchMaMon").value;
    const res = await fetch(`${API}/recipes/${maMon}`);
    const data = await res.json();
    render(data);
}

// ADD
async function addRecipe() {
    const maMon = document.getElementById("maMon").value;
    const maNL = document.getElementById("maNL").value;
    const soLuong = document.getElementById("soLuong").value;

    const body = {
        MaMon: parseInt(maMon),
        ingredients: [
            {
                MaNL: parseInt(maNL),
                SoLuongSuDung: parseFloat(soLuong)
            }
        ]
    };

    await fetch(`${API}/recipes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });

    loadAll();
}

// DELETE
async function deleteRecipe(id) {
    await fetch(`${API}/recipes/${id}`, {
        method: "DELETE"
    });

    loadAll();
}

// RENDER TABLE
function render(data) {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    data.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item.MaCT || "-"}</td>
                <td>${item.MaMon}</td>
                <td>${item.MaNL}</td>
                <td>${item.TenNL || "-"}</td>
                <td>${item.SoLuongSuDung}</td>
                <td>${item.DonViTinh || "-"}</td>
                <td>
                    <button onclick="deleteRecipe(${item.MaCT})">Xoá</button>
                </td>
            </tr>
        `;
    });
}

// INIT
loadAll();

</script>

</body>
</html>
