<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Coffee Menu Dashboard</title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/menu.css') }}"
    >

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>

<div class="wrapper">

    <!-- =========================
         SIDEBAR
    ========================== -->
<div class="sidebar">
        <h2 class="logo">Quản Lý <br> Quán Cafe</h2>
        <ul>
            <li class="active" onclick="window.location.href='/menu/'" style="cursor: pointer;">Menu</li>
            
            <li onclick="window.location.href='/inventory/'" style="cursor: pointer;">Inventory</li>
            
            <li onclick="window.location.href='/recipe/'" style="cursor: pointer;">Recipe</li>
            
            <li onclick="window.location.href='/order/'" style="cursor: pointer;">Order</li>
            
            <li onclick="window.location.href='/reports/'" style="cursor: pointer;">Reports</li>

        </ul>
    </div>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <div class="main-content">

        <!-- TITLE -->
        <div class="page-title">

            <h1>Quản lý Menu</h1>

        </div>


        <!-- =========================
             SEARCH BOX
        ========================== -->
        <div class="search-box">

            <input
                type="text"
                id="searchKeyword"
                class="form-control"
                placeholder="Tên món hoặc mã..."
                onkeyup="searchMenu()"
            >

            <input
                type="text"
                id="searchCategory"
                class="form-control"
                placeholder="Danh mục"
                onkeyup="searchMenu()"
            >

            <select
                id="searchStatus"
                class="form-select"
                onchange="searchMenu()"
            >

                <option value="">Trạng thái</option>

                <option value="ACTIVE">ACTIVE</option>

                <option value="INACTIVE">INACTIVE</option>

            </select>

            <input
                type="number"
                id="minPrice"
                class="form-control"
                placeholder="Giá từ"
                onkeyup="searchMenu()"
            >

            <input
                type="number"
                id="maxPrice"
                class="form-control"
                placeholder="Giá đến"
                onkeyup="searchMenu()"
            >

        </div>


        <!-- =========================
             STATISTICS
        ========================== -->
        <div class="cards">

            <div class="card-box">

                <h3>Tổng món</h3>

                <p id="totalMenu">0</p>

            </div>

            <div class="card-box">

                <h3>Đang bán</h3>

                <p id="activeMenu">0</p>

            </div>

            <div class="card-box">

                <h3>Ngừng bán</h3>

                <p id="inactiveMenu">0</p>

            </div>

        </div>


        <!-- =========================
             FORM
        ========================== -->
        <div class="form-box">

            <h3>Thêm / Sửa món</h3>

            <div class="form-grid">

                <input
                    id="TenMon"
                    class="form-control"
                    placeholder="Tên món"
                >

                <input
                    id="GiaBan"
                    class="form-control"
                    placeholder="Giá bán"
                    type="number"
                >

                <input
                    id="MoTa"
                    class="form-control"
                    placeholder="Mô tả"
                >

                <input
                    id="MaDM"
                    class="form-control"
                    placeholder="Mã danh mục"
                    type="number"
                >

                <select
                    id="TrangThai"
                    class="form-select"
                >

                    <option value="ACTIVE">
                        ACTIVE
                    </option>

                    <option value="INACTIVE">
                        INACTIVE
                    </option>

                </select>

            </div>


            <!-- BUTTON -->
            <div class="action-buttons">

                <button
                    class="btn btn-warning"
                    onclick="addMenu()"
                >
                    Thêm món
                </button>

                <button
                    class="btn btn-dark"
                    onclick="updateMenu()"
                >
                    Cập nhật
                </button>

            </div>

        </div>


        <!-- =========================
             TABLE
        ========================== -->
        <div class="table-box">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Tên món</th>

                        <th>Giá</th>

                        <th>Mô tả</th>

                        <th>Danh mục</th>

                        <th>Trạng thái</th>

                        <th>Hành động</th>

                    </tr>

                </thead>

                <tbody id="menuTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- JS -->
<script
    src="{{ url_for('static', filename='js/menu.js') }}"
></script>

</body>

</html>
