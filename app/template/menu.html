<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Menu</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

        input, select {
            padding: 5px;
            margin: 5px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        .active { color: green; font-weight: bold; }
        .inactive { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h2>QUẢN LÝ MENU</h2>

<!-- FORM THÊM / SỬA -->
<div>
    <input id="TenMon" placeholder="Tên món">
    <input id="GiaBan" placeholder="Giá bán">
    <input id="MoTa" placeholder="Mô tả">

    <select id="TrangThai">
        <option value="ACTIVE">ACTIVE</option>
        <option value="INACTIVE">INACTIVE</option>
    </select>

    <input id="MaDM" placeholder="Mã danh mục">

    <button onclick="addMenu()">Thêm món</button>
    <button onclick="updateMenu()">Cập nhật</button>
</div>

<hr>

<!-- TABLE -->
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Tên món</th>
            <th>Giá</th>
            <th>Mô tả</th>
            <th>Danh mục</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
    </thead>
    <tbody id="menuTable"></tbody>
</table>

<script>

let editingId = null;

function loadMenu() {
    fetch("/menu/api")
        .then(res => res.json())
        .then(data => {
            let html = "";

            data.forEach(item => {
                html += `
                <tr>
                    <td>${item.MaMon}</td>
                    <td>${item.TenMon}</td>
                    <td>${item.GiaBan}</td>
                    <td>${item.MoTa || ""}</td>
                    <td>${item.TenDanhMuc}</td>
                    <td class="${item.TrangThai === 'ACTIVE' ? 'active' : 'inactive'}">
                        ${item.TrangThai}
                    </td>
                    <td>
                        <button onclick="editMenu(${item.MaMon})">Sửa</button>
                        <button onclick="deleteMenu(${item.MaMon})">Xóa</button>
                        <button onclick="toggleStatus(${item.MaMon}, '${item.TrangThai}')">
                            Bật/Tắt
                        </button>
                    </td>
                </tr>
                `;
            });

            document.getElementById("menuTable").innerHTML = html;
        });
}

loadMenu();

function addMenu() {
    const data = getFormData();

    fetch("/menu/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    }).then(() => loadMenu());
}

function editMenu(id) {
    fetch("/menu/" + id)
        .then(res => res.json())
        .then(data => {
            document.getElementById("TenMon").value = data.TenMon;
            document.getElementById("GiaBan").value = data.GiaBan;
            document.getElementById("MoTa").value = data.MoTa;
            document.getElementById("TrangThai").value = data.TrangThai;
            document.getElementById("MaDM").value = data.MaDM;

            editingId = id;
        });
}

function updateMenu() {
    if (!editingId) return alert("Chưa chọn món");

    const data = getFormData();

    fetch("/menu/" + editingId, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    }).then(() => {
        editingId = null;
        loadMenu();
    });
}


function deleteMenu(id) {
    fetch("/menu/" + id, {
        method: "DELETE"
    }).then(() => loadMenu());
}

function toggleStatus(id, status) {
    let newStatus = status === "ACTIVE" ? "INACTIVE" : "ACTIVE";

    fetch("/menu/" + id, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            TenMon: "",
            GiaBan: 0,
            MoTa: "",
            MaDM: 1,
            TrangThai: newStatus
        })
    }).then(() => loadMenu());
}

function getFormData() {
    return {
        TenMon: document.getElementById("TenMon").value,
        GiaBan: document.getElementById("GiaBan").value,
        MoTa: document.getElementById("MoTa").value,
        TrangThai: document.getElementById("TrangThai").value,
        MaDM: document.getElementById("MaDM").value
    };
}

</script>

</body>
</html>
