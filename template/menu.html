<!DOCTYPE html>
<html>

<head>

    <title>Menu Coffee</title>

    <style>

        body{
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }

        h1{
            color: #333;
        }

        .menu-container{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card{
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .price{
            color: green;
            font-weight: bold;
        }

        .status{
            color: orange;
        }

    </style>

</head>

<body>

    <h1>Danh Sách Menu</h1>

    <div class="menu-container" id="menu-list">

    </div>

    <script>

        async function loadMenu(){

            const response = await fetch(
                "http://127.0.0.1:5000/menu"
            )

            const data = await response.json()

            const menuList =
                document.getElementById("menu-list")

            data.forEach(item => {

                menuList.innerHTML += `
                
                    <div class="card">

                        <h3>${item.TenMon}</h3>

                        <p>${item.MoTa}</p>

                        <p class="price">
                            ${item.GiaBan} VND
                        </p>

                        <p>
                            Danh mục:
                            ${item.TenDanhMuc}
                        </p>

                        <p class="status">
                            ${item.TrangThai}
                        </p>

                    </div>

                `
            })
        }

        loadMenu()

    </script>

</body>

</html>
